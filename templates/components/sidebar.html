<style>
    #dashboardSidebarNav {
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    #dashboardSidebarNav::-webkit-scrollbar {
        display: none;
    }
</style>
<aside id="dashboardSidebar" class="fixed inset-y-0 left-0 z-40 hidden w-64 border-r border-gray-100 bg-white shadow-sm lg:block">
    <div class="flex h-full flex-col">
        <div class="flex h-16 items-center justify-between gap-3 border-b border-gray-100 px-5">
            <div class="flex items-center gap-3">
                <span class="material-symbols-rounded flex h-10 w-10 items-center justify-center rounded-2xl bg-green-600 text-white shadow-md">dentistry</span>
                <div>
                    <p class="text-lg font-bold text-gray-900">DentalCare</p>
                    <p class="text-xs font-medium text-green-600">{{ dashboard_role_label }}</p>
                </div>
            </div>
            <button type="button" data-sidebar-close class="rounded-xl px-2 py-1 text-gray-400 hover:bg-gray-100 lg:hidden"><span class="material-symbols-rounded">close</span></button>
        </div>

        <nav id="dashboardSidebarNav" class="flex-1 space-y-1 overflow-y-auto px-3 py-5 text-sm font-medium">
            {% for item in dashboard_menu %}
            <a href="{{ item.href }}" class="flex items-center gap-3 rounded-2xl px-4 py-3 transition {% if item.is_active %}bg-green-50 font-semibold text-green-700{% else %}text-gray-600 hover:bg-green-50 hover:text-green-700{% endif %}">
                <span class="material-symbols-rounded {% if item.is_active %}flex h-8 w-8 items-center justify-center rounded-xl bg-green-600 text-white{% else %}w-8 text-center text-green-600{% endif %}">{{ item.icon }}</span>
                <span>{{ item.label }}</span>
            </a>
            {% empty %}
            <a href="{% url 'dashboard:redirect' %}" class="flex items-center gap-3 rounded-2xl px-4 py-3 text-gray-600 transition hover:bg-green-50 hover:text-green-700">
                <span class="material-symbols-rounded w-8 text-center text-green-600">dashboard</span>
                <span>Dashboard</span>
            </a>
            {% endfor %}
        </nav>

        <div class="border-t border-gray-100 p-3">
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button class="flex w-full items-center gap-3 rounded-2xl px-4 py-3 text-sm font-semibold text-gray-600 transition hover:bg-red-50 hover:text-red-600">
                    <span class="material-symbols-rounded w-8 text-center">logout</span> Logout
                </button>
            </form>
        </div>
    </div>
</aside>
