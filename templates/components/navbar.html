<header class="sticky top-0 z-30 border-b border-gray-100 bg-white">
    <div class="flex h-16 items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
            <button type="button" data-sidebar-open class="inline-flex items-center gap-2 rounded-2xl bg-green-600 px-3 py-2 text-sm font-bold text-white shadow-sm lg:hidden"><span class="material-symbols-rounded text-xl">menu</span> Menu</button>
            <div class="hidden items-center gap-3 rounded-2xl bg-gray-50 px-4 py-2 md:flex">
                <span class="material-symbols-rounded text-gray-400">search</span>
                <input class="w-56 border-0 bg-transparent p-0 text-sm shadow-none focus:ring-0" type="search" placeholder="Search patients, appointments">
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="hidden rounded-full bg-green-50 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-green-700 sm:inline-flex">{{ request.user.get_role_display }}</span>
            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-green-100 text-green-700"><span class="material-symbols-rounded">account_circle</span></div>
        </div>
    </div>
</header>
