{% comment %}
  Variables accepted via {% include ... with %}:
    card_name  – service title
    card_desc  – short description
    card_bg    – full CSS background declaration, e.g. "background:linear-gradient(...)"
{% endcomment %}
<div class="bg-white rounded-2xl shadow-md overflow-hidden"
     style="transition:box-shadow .22s,transform .22s;"
     onmouseover="this.style.boxShadow='0 20px 40px rgba(0,0,0,.13)';this.style.transform='translateY(-5px)'"
     onmouseout="this.style.boxShadow='';this.style.transform=''">

  <!-- ── Image / gradient area ── -->
  <div class="relative flex items-center justify-center"
       style="height:210px;{{ card_bg|default:'background:linear-gradient(135deg,#dcfce7 0%,#86efac 100%)' }}">
    <!-- Tooth silhouette at low opacity -->
    <svg style="width:96px;height:96px;opacity:.18;" fill="white" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 4c-5.5 0-9.5 3.5-11 7.5C19.5 9 17.5 8 15 8 10.5 8 7 11.5 7 16c0 7 5 11.5 9 16 2 2.5 3.5 5 4.5 8.5.5 2 1.5 3.5 3.5 3.5s3-1.5 3.5-3.5c.5 2 1.5 3.5 3.5 3.5s3-1.5 3.5-3.5C35 37 36.5 34.5 39 32c4-4 9-8.5 9-16C48 11.5 44 8 39.5 8c-2.5 0-4.5 1-6 3.5C32 8 31 4 32 4Z"/>
    </svg>
  </div>

  <!-- ── Content with floating icon ── -->
  <div class="relative px-5 pb-5" style="padding-top:30px;">
    <!-- Floating white circle icon -->
    <div class="absolute bg-white border border-slate-100 shadow-md rounded-full flex items-center justify-center"
         style="width:52px;height:52px;top:-26px;left:18px;">
      <svg style="width:24px;height:24px;" fill="none" stroke="#166534" viewBox="0 0 24 24" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <h3 class="font-bold text-slate-900" style="font-size:16px;line-height:1.35;">{{ card_name }}</h3>
    <p class="text-slate-500 mt-1.5"
       style="font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;">
      {{ card_desc }}
    </p>
    <a href="#" class="inline-flex items-center gap-1 font-semibold"
       style="margin-top:14px;font-size:13.5px;color:#166534;">
      Read More
      <svg style="width:14px;height:14px;" fill="none" stroke="currentColor"
           viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
      </svg>
    </a>
  </div>
</div>
