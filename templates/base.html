{% load static %}
<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DentalCare{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/><text y='.9em' font-size='75' x='10'>🦷</text></svg>">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="min-h-full bg-gradient-to-br from-slate-50 via-white to-teal-50 text-slate-900 antialiased">
    {% if messages %}
        <div class="mx-auto mt-4 max-w-7xl px-4 sm:px-6 lg:px-8">
            {% for message in messages %}
                <div role="status" class="flex items-start gap-3 rounded-xl border {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-900{% else %}border-teal-200 bg-teal-50 text-teal-900{% endif %} px-4 py-3 text-sm font-medium shadow-sm">
                    <span class="material-symbols-rounded mt-0.5 text-lg">{% if message.tags == 'error' %}error{% else %}check_circle{% endif %}</span>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/dashboard_crud.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
