{% for field in form %}
    <div>
        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700">{{ field.label }}</label>
        <div class="mt-2">{{ field }}</div>
        {% if field.help_text %}
            <p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>
        {% endif %}
        {% for error in field.errors %}
            <p class="mt-1 text-sm text-red-600">{{ error }}</p>
        {% endfor %}
    </div>
{% endfor %}
{% if form.non_field_errors %}
    <div class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ form.non_field_errors }}
    </div>
{% endif %}
