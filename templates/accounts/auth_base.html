{% load static %}
<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DentalCare{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="h-full">
    <main class="auth-shell min-h-screen">
        <div class="auth-overlay min-h-screen px-4 py-8 sm:px-6 lg:px-12">
            {% if messages %}
                <div class="mx-auto mb-4 max-w-md lg:ml-auto lg:mr-20">
                    {% for message in messages %}
                        <div class="rounded-xl border {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-900{% else %}border-emerald-200 bg-emerald-50 text-emerald-900{% endif %} px-4 py-3 text-sm shadow-sm">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            <section class="auth-stage flex items-center justify-center lg:justify-end">
                <div class="auth-card rounded-2xl bg-white p-5 shadow-2xl sm:p-6 lg:mr-24">
                    <a href="{% url 'home' %}" class="mb-6 flex items-center gap-3">
                        <span class="material-symbols-rounded flex h-10 w-10 items-center justify-center rounded-full bg-emerald-600 text-white shadow-lg shadow-emerald-600/20">dentistry</span>
                        <span class="text-2xl font-bold tracking-tight text-slate-950">DentalCare</span>
                    </a>
                    {% block auth_content %}{% endblock %}
                </div>
            </section>

        </div>
    </main>
</body>
</html>
